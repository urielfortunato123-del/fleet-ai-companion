<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frota em Dia</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#0f172a;background:#f3f4f6}*{box-sizing:border-box}body{margin:0;background:#f3f4f6;min-height:100vh}.top{height:92px;background:#0f172a;color:white;display:flex;align-items:center;padding:14px 18px;gap:14px;position:sticky;top:0;z-index:5}.logo{width:58px;height:58px;border-radius:18px;background:#f59e0b;display:grid;place-items:center;font-size:30px}.title{font-size:26px;font-weight:800;flex:1}.gear{border:0;background:#1e293b;color:white;width:56px;height:56px;border-radius:17px;font-size:25px}.wrap{padding:20px;max-width:720px;margin:auto}.card{background:white;border-radius:22px;padding:20px;box-shadow:0 7px 26px #0f172a12;margin-bottom:16px}h1{font-size:28px;margin:0 0 6px}h2{font-size:21px;margin:0 0 12px}.muted{color:#64748b}.label{display:block;font-weight:750;color:#334155;margin:14px 0 6px}.input{width:100%;height:58px;border:1px solid #cbd5e1;border-radius:15px;background:white;padding:0 15px;font-size:18px;color:#0f172a;outline:none}.input:focus{border-color:#64748b;box-shadow:0 0 0 3px #64748b18}.btn{width:100%;height:56px;border:0;border-radius:16px;font-size:17px;font-weight:800;margin-top:10px;padding:0 14px}.primary{background:#0f172a;color:white}.orange{background:#d97706;color:white}.gray{background:#334155;color:white}.light{background:#e2e8f0;color:#0f172a}.danger{background:#fee2e2;color:#991b1b}.status{padding:20px;border-radius:20px;margin:16px 0}.ok{background:#dcfce7}.warn{background:#fef3c7}.over{background:#fee2e2}.big{font-size:34px;font-weight:900}.next{font-size:16px;font-weight:700;margin-top:7px}.remain{font-size:23px;font-weight:900;margin-top:4px}.warn .remain,.over .remain{color:#b45309}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e2e8f0}.row:last-child{border-bottom:0}.history-item{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:12px 14px;margin:7px 0;display:flex;justify-content:space-between;gap:10px}.footer{text-align:center;color:#94a3b8;font-size:13px;font-weight:750;padding:26px 4px 14px}.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:750;background:#e2e8f0}.pill.on{background:#dcfce7;color:#166534}.pill.off{background:#fee2e2;color:#991b1b}.preview{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:14px;padding:13px;margin-top:8px;display:flex;justify-content:space-between}.modal{position:fixed;inset:0;background:#02061799;display:none;align-items:flex-end;z-index:30}.modal.show{display:flex}.sheet{background:white;width:100%;border-radius:28px 28px 0 0;padding:22px 20px 28px;max-height:88vh;overflow:auto}.sheet h2{font-size:25px}.notice{border-radius:16px;padding:14px;margin:12px 0;background:#f8fafc}.notice.warning{background:#fef3c7}.notice.danger{background:#fee2e2}.spinner{display:inline-block;width:18px;height:18px;border:2px solid #cbd5e1;border-top-color:#0f172a;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="top"><div class="logo">🚗</div><div class="title">Frota em Dia</div><button class="gear" onclick="openSettings()">⚙</button></header>
<main class="wrap" id="app"></main>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const $=s=>document.querySelector(s);const fmt=n=>new Intl.NumberFormat('pt-BR').format(Math.round(Number(n)||0));
const KEY='frota.profile',HKEY='frota.history.v013';let profile=loadProfile(),history=loadHistory(),pendingDetected=-1;
function loadProfile(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
function saveProfile(){localStorage.setItem(KEY,JSON.stringify(profile))}
function loadHistory(){try{return JSON.parse(localStorage.getItem(HKEY)||'[]')}catch{return[]}}
function saveHistory(){localStorage.setItem(HKEY,JSON.stringify(history.slice(-100)))}
function currentKm(){return Number(profile?.currentKm||0)}function nextKm(){return Number(profile?.lastOilKm||0)+Number(profile?.oilIntervalKm||10000)}function remain(){return nextKm()-currentKm()}
function normPlate(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,7)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notifEnabled(){try{return !!AndroidBridge.notificationsEnabled()}catch{return false}}
function render(){profile?renderDash():renderSetup()}
function renderSetup(){
 $('#app').innerHTML=`<section class="card"><h1>Cadastrar veículo</h1><div class="muted">Depois do cadastro, no fim do dia basta fotografar o hodômetro.</div>
 <label class="label">Motorista</label><input class="input" id="driver" placeholder="Nome do motorista">
 <label class="label">Placa</label><input class="input" id="plate" maxlength="7" placeholder="ABC1D23">
 <label class="label">Modelo do veículo</label><input class="input" id="model" placeholder="HB20">
 <label class="label">Quilometragem atual</label><input class="input" id="current" inputmode="numeric" placeholder="26430">
 <label class="label">KM da última troca de óleo</label><input class="input" id="last" inputmode="numeric" placeholder="21787">
 <label class="label">Intervalo entre trocas</label><input class="input" id="interval" inputmode="numeric" value="10000">
 <div class="preview"><span>Próxima troca calculada</span><strong id="preview">—</strong></div>
 <button class="btn primary" onclick="saveSetup()">Salvar cadastro</button></section><div class="footer">Desenvolvido Por Uriel da Fonseca Fortunato</div>`;
 ['last','interval'].forEach(id=>$('#'+id).addEventListener('input',preview));$('#plate').addEventListener('input',e=>e.target.value=normPlate(e.target.value));preview();
}
function preview(){let a=Number($('#last')?.value||0),b=Number($('#interval')?.value||0);if($('#preview'))$('#preview').textContent=b>=500?fmt(a+b)+' km':'—'}
function saveSetup(){let driver=$('#driver').value.trim(),plate=normPlate($('#plate').value),model=$('#model').value.trim(),current=Number($('#current').value),last=Number($('#last').value),interval=Number($('#interval').value);if(!driver||!plate||!model||!Number.isFinite(current)||!Number.isFinite(last)||interval<500)return alert('Confira os dados do cadastro.');if(last>current)return alert('O KM da última troca não pode ser maior que o KM atual.');profile={driverName:driver,plate,vehicleModel:model,currentKm:current,lastOilKm:last,oilIntervalKm:interval,alertThresholdKm:500,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};saveProfile();render()}
function renderDash(){let r=remain(),cls=r<0?'over':r<=500?'warn':'ok',txt=r<0?`Manutenção vencida em ${fmt(-r)} km`:r===0?'Troca de óleo agora':`Faltam ${fmt(r)} km`;
 let items=history.slice(-5).reverse().map(x=>`<div class="history-item"><span>${esc(x.date)}</span><strong>${fmt(x.km)} km</strong></div>`).join('')||'<div class="muted">Ainda não há registros nesta versão.</div>';
 $('#app').innerHTML=`<div class="muted">Olá, ${esc(profile.driverName||'Motorista')}</div><h1>${esc(profile.vehicleModel)} • ${esc(profile.plate)}</h1>
 <section class="status ${cls}"><div class="muted">Quilometragem atual</div><div class="big">${fmt(currentKm())} km</div><div class="next">Próxima troca: ${fmt(nextKm())} km</div><div class="remain">${txt}</div></section>
 <button class="btn primary" onclick="capture()">📷 Registrar KM do dia</button><button class="btn orange" onclick="maintenanceDone()">✓ Manutenção realizada</button><button class="btn gray" onclick="testNotif()">🔔 Testar notificação</button>
 <div style="margin-top:12px"><span class="pill ${notifEnabled()?'on':'off'}">${notifEnabled()?'● Notificações ativadas':'● Notificações desativadas'}</span></div>
 <section class="card" style="margin-top:22px"><h2>Histórico recente</h2>${items}</section><div class="footer">Desenvolvido Por Uriel da Fonseca Fortunato</div>`;}
function capture(){if(!profile)return;showModal(`<h2>Ler hodômetro</h2><div class="notice"><span class="spinner"></span>Abrindo câmera…</div><button class="btn light" onclick="closeModal()">Cancelar</button>`);try{AndroidBridge.captureOdometer(currentKm())}catch(e){closeModal();alert('A câmera nativa não está disponível.') }}
window.onOcrStatus=t=>{if($('#sheet'))$('#sheet').innerHTML=`<h2>OCR do hodômetro</h2><div class="notice"><span class="spinner"></span>${esc(t)}</div>`}
window.onOcrResult=(detected,raw)=>{pendingDetected=Number(detected);showModal(`<h2>Confirmar quilometragem</h2><div class="notice">${pendingDetected>0?`Hodômetro detectado: <strong>${fmt(pendingDetected)} km</strong>`:'Não consegui ler o hodômetro com segurança.'}</div><label class="label">KM atual</label><input class="input" id="kmConfirm" inputmode="numeric" value="${pendingDetected>0?pendingDetected:''}" placeholder="Digite o KM"><div class="muted" style="margin-top:8px">Confira antes de salvar. O OCR nunca grava sozinho.</div><button class="btn primary" onclick="confirmKm()">Confirmar e salvar</button><button class="btn light" onclick="closeModal()">Cancelar</button>`)}
function confirmKm(){let km=Number($('#kmConfirm').value);if(!Number.isFinite(km))return alert('Digite uma quilometragem válida.');if(km<currentKm())return alert('O KM não pode ser menor que o último registro.');if(km-currentKm()>3000&&!confirm('O novo KM está mais de 3.000 km acima do anterior. Confirma?'))return;profile.currentKm=km;profile.updatedAt=new Date().toISOString();saveProfile();history.push({date:new Date().toLocaleString('pt-BR'),km});saveHistory();let r=remain();if(r<=500){try{AndroidBridge.maintenanceAlert(profile.vehicleModel,profile.plate,r)}catch{}playSoft()};showDailyPopup(r)}
function showDailyPopup(r){let kind=r<0?'danger':r<=500?'warning':'',msg=r<0?`A troca de óleo está vencida em <strong>${fmt(-r)} km</strong>.`:r<=500?`Faltam apenas <strong>${fmt(r)} km</strong> para a troca de óleo.`:`Faltam <strong>${fmt(r)} km</strong> para a próxima troca de óleo.`;showModal(`<h2>${r<=500?'⚠ Manutenção próxima':'Registro concluído'}</h2><div class="notice ${kind}">KM atual: <strong>${fmt(currentKm())} km</strong><br>Próxima troca: <strong>${fmt(nextKm())} km</strong><br><br>${msg}</div><button class="btn primary" onclick="closeAndRender()">OK</button>`)}
function maintenanceDone(){let km=prompt('KM em que a troca de óleo foi realizada:',String(currentKm()));if(km===null)return;km=Number(km);if(!Number.isFinite(km))return alert('KM inválido.');profile.lastOilKm=km;if(km>currentKm())profile.currentKm=km;profile.updatedAt=new Date().toISOString();saveProfile();history.push({date:new Date().toLocaleString('pt-BR')+' • troca de óleo',km});saveHistory();alert('Manutenção registrada. Novo ciclo iniciado.');render()}
function openSettings(){if(!profile){showNotifSettings();return}showModal(`<h2>Configurações</h2><div class="row"><span>Motorista</span><strong>${esc(profile.driverName)}</strong></div><div class="row"><span>Veículo</span><strong>${esc(profile.vehicleModel)}</strong></div><div class="row"><span>Placa</span><strong>${esc(profile.plate)}</strong></div><div class="row"><span>Última troca</span><strong>${fmt(profile.lastOilKm)} km</strong></div><div class="row"><span>Intervalo</span><strong>${fmt(profile.oilIntervalKm)} km</strong></div><button class="btn light" onclick="editProfile()">Editar cadastro</button><button class="btn gray" onclick="requestNotif()">Ativar notificações</button><button class="btn light" onclick="openNativeNotifSettings()">Abrir configurações de notificações</button><button class="btn danger" onclick="eraseAll()">Apagar dados deste aparelho</button><button class="btn light" onclick="closeModal()">Fechar</button>`)}
function editProfile(){closeModal();let old=profile;profile=null;render();setTimeout(()=>{if($('#driver')){$('#driver').value=old.driverName||'';$('#plate').value=old.plate||'';$('#model').value=old.vehicleModel||'';$('#current').value=old.currentKm||0;$('#last').value=old.lastOilKm||0;$('#interval').value=old.oilIntervalKm||10000;preview();profile=old}},20)}
function requestNotif(){try{AndroidBridge.requestNotifications()}catch{alert('Não foi possível abrir a permissão.')}}function testNotif(){try{AndroidBridge.testNotification()}catch{alert('Notificação nativa indisponível.')}}function openNativeNotifSettings(){try{AndroidBridge.openNotificationSettings()}catch{}}
window.onNotificationPermission=granted=>{if(granted){closeModal();render()}else render()}
function showNotifSettings(){showModal(`<h2>Notificações</h2><div class="notice">Ative as notificações para receber o alerta quando faltarem 500 km ou menos para a troca de óleo.</div><button class="btn primary" onclick="requestNotif()">Ativar notificações</button><button class="btn light" onclick="openNativeNotifSettings()">Abrir configurações do Android</button><button class="btn light" onclick="closeModal()">Fechar</button>`)}
function eraseAll(){if(!confirm('Apagar cadastro e histórico deste aparelho?'))return;localStorage.removeItem(KEY);localStorage.removeItem(HKEY);profile=null;history=[];closeModal();render()}
function showModal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}function closeAndRender(){closeModal();render()}
function playSoft(){try{let C=window.AudioContext||window.webkitAudioContext,ctx=new C(),gain=ctx.createGain();gain.gain.value=.09;gain.connect(ctx.destination);let t=ctx.currentTime;[[660,t,.12],[780,t+.18,.14]].forEach(([f,start,d])=>{let o=ctx.createOscillator();o.type='sine';o.frequency.value=f;o.connect(gain);o.start(start);o.stop(start+d)});setTimeout(()=>ctx.close(),700)}catch{}}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});render();
</script>
</body></html>
